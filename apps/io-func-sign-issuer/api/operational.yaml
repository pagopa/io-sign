openapi: 3.0.3
info:
  title: Firma con IO - Operational API
  version: 1.0.0
servers:
  - url: https://api.io.pagopa.it/api/v1/sign/operational
    description: production
security:
  - SubscriptionKey: []
paths:
  /signature-requests/{signatureRequestId}/outcome-notification:
    post:
      operationId: sendOutcomeNotification
      tags:
        - Signature Request
      summary: Send a signature request outcome notification to user via IO message
      description: |
        Sends the outcome recorded on a SIGNED or REJECTED signature request.
        No request body is required. Requests with an outcome notification
        already recorded are rejected.
        Do not retry automatically: a timeout or a failure to save the message
        identifier may occur after the message has been sent.
      parameters:
        - in: path
          name: signatureRequestId
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: The notification detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDetailView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Unexpected"
        default:
          $ref: "#/components/responses/Unexpected"

components:
  securitySchemes:
    SubscriptionKey:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
      description: The API key can be obtained from the reserved area

  responses:
    BadRequest:
      description: Validation error on body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    Forbidden:
      description: You don't have enough privileges to perform this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    TooManyRequests:
      description: Too Many Requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    Unexpected:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  schemas:
    Id:
      type: string
      description: Entity Id
      format: NonEmptyString
      example: 01ARZ3NDEKTSV4RRFFQ69G5FAV
      x-import: "@pagopa/ts-commons/lib/strings"

    NotificationDetailView:
      type: object
      properties:
        io_message_id:
          type: string
      required:
        - io_message_id

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |-
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type
            (e.g., using HTML).
          default: about:blank
          example: https://example.com/problem/constraint-violation
        title:
          type: string
          description: >-
            A short, summary of the problem type. Written in english and
            readable

            for engineers (usually not suited for non technical stakeholders and

            not localized); example: Service Unavailable
        status:
          type: integer
          format: int32
          description: >-
            The HTTP status code generated by the origin server for this
            occurrence of the problem.
          minimum: 100
          maximum: 600
          exclusiveMaximum: true
          example: 200
        detail:
          type: string
          description: |-
            A human readable explanation specific to this occurrence of the
            problem.
          example: There was an error processing the request
        instance:
          type: string
          format: uri
          description: >-
            An absolute URI that identifies the specific occurrence of the
            problem. It may or may not yield further information if
            dereferenced.
