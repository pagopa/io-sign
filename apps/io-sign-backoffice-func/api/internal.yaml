openapi: 3.0.3
info:
  title: Firma con IO - Back office Internal API
  version: 1.0.1
servers:
  - url: https://localhost
    description: local
security:
  - FunctionKey: []
paths:
  /info:
    get:
      operationId: getInfo
      tags:
        - Health Check
      summary: Health check endpoint
      security: []
      responses:
        "200":
          description: Used to check if the function is active
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - version
                properties:
                  message:
                    type: string
                    example: "It's working!"
                  version:
                    type: string
                    example: "1.4.2"

  /api-keys/{id}:
    get:
      operationId: getApiKey
      tags:
        - Issuer
      summary: Get an Api Key by Id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: "Api Key detail"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /institutions/{institutionId}/issuers/{issuerId}/webhook:
    get:
      operationId: getWebhookByIssuerAndInstitution
      tags:
        - Webhook
      summary: Get the webhook configured for an issuer and institution
      parameters:
        - in: path
          name: institutionId
          required: true
          schema:
            $ref: "#/components/schemas/InstitutionId"
        - in: path
          name: issuerId
          required: true
          schema:
            $ref: "#/components/schemas/IssuerId"
      responses:
        "200":
          description: Webhook detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookView"
        "404":
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

components:
  securitySchemes:
    FunctionKey:
      type: apiKey
      name: x-functions-key
      in: header

  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |-
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type
            (e.g., using HTML).
          default: about:blank
          example: https://example.com/problem/constraint-violation
        title:
          type: string
          description: >-
            A short, summary of the problem type. Written in english and
            readable

            for engineers (usually not suited for non technical stakeholders and

            not localized); example: Service Unavailable
        status:
          type: integer
          format: int32
          description: >-
            The HTTP status code generated by the origin server for this
            occurrence of the problem.
          minimum: 100
          maximum: 600
          example: 200
        detail:
          type: string
          description: |-
            A human readable explanation specific to this occurrence of the
            problem.
          example: There was an error processing the request
        instance:
          type: string
          format: uri
          description: >-
            An absolute URI that identifies the specific occurrence of the
            problem. It may or may not yield further information if
            dereferenced.

    Id:
      type: string
      description: Entity Id
      format: NonEmptyString
      example: 01ARZ3NDEKTSV4RRFFQ69G5FAV
      x-import: "@pagopa/ts-commons/lib/strings"

    IssuerId:
      type: string
      description: Issuer Id
      format: NonEmptyString
      example: 12345678901
      x-import: "@pagopa/ts-commons/lib/strings"

    InstitutionId:
      type: string
      description: Institution Id
      format: uuid
      example: 7d0da980-6dc2-4cf9-8f0f-6a2f6fb5528f

    WebhookStatus:
      type: string
      enum:
        - active
        - inactive

    WebhookView:
      type: object
      required:
        - url
        - privateKeySecretName
        - issuerId
        - status
      properties:
        url:
          type: string
          format: uri
        privateKeySecretName:
          type: string
          minLength: 1
        issuerId:
          $ref: "#/components/schemas/IssuerId"
        status:
          $ref: "#/components/schemas/WebhookStatus"