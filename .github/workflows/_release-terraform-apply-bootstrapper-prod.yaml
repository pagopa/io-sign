name: Release Bootstrapper Infrastructure - prod
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/bootstrapper/prod/**"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    uses: pagopa/dx/.github/workflows/release-terraform-bootstrapper-v1.yaml@8ec64257f46bb8c03509d317b42fbf6a2da2c63a # main
    name: Release Bootstrapper (prod)
    secrets: inherit
    with:
      environment: 'prod'
