name: PR - IO Sign ITN TF Validation

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - ".terraform-version"
      - "infra/italynorth/prod/**"
      - "infra/italynorth/_modules/**"
      - "apps/io-func-sign-issuer/api/**"
      - "apps/io-func-sign-user/api/**"
      - "apps/io-sign-backoffice-func/api/**"
      - ".github/workflows/itn-tf-code-review.yaml"

jobs:
  prod_itn_core_code_review:
    uses: pagopa/dx/.github/workflows/infra_plan.yaml@d137c49e2c0a935a544a3b87dae98472e5e5c4fd # main
    name: Prod - Code Review
    secrets: inherit
    with:
      environment: prod
      base_path: infra/italynorth
      override_github_environment: infra-prod
      use_private_agent: true
