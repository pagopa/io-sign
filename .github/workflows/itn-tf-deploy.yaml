name: PR - IO Sign ITN TF Apply

on: 
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/italynorth/prod/**"
      - "infra/italynorth/_modules/**"
      - "apps/io-func-sign-issuer/api/**"
      - "apps/io-func-sign-user/api/**"
      - "apps/io-sign-backoffice-func/api/**"
      - ".github/workflows/itn-tf-deploy.yaml"

jobs:
  prod_itn_core_deploy:
    uses: pagopa/dx/.github/workflows/infra_apply.yaml@d137c49e2c0a935a544a3b87dae98472e5e5c4fd # main
    name: Prod - Code Deploy
    secrets: inherit
    with:
      environment: prod
      base_path: infra/italynorth
      override_github_environment: infra-prod
      use_private_agent: true
