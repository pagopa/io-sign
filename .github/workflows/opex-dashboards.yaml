name: OpEx Dashboards

on:
  push:
    branches:
      - main
    paths:
      - "apps/io-func-sign-issuer/api/external.yaml"
      - "apps/io-func-sign-user/api/external.yaml"
      - "apps/io-func-sign-support/openapi.yaml"
      - "apps/io-sign-backoffice-func/api/external.yaml"
      - ".opex/**"
      - ".github/workflows/opex-dashboards.yaml"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "apps/io-func-sign-issuer/api/external.yaml"
      - "apps/io-func-sign-user/api/external.yaml"
      - "apps/io-func-sign-support/openapi.yaml"
      - "apps/io-sign-backoffice-func/api/external.yaml"
      - ".opex/**"
      - ".github/workflows/opex-dashboards.yaml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  opex_dashboards:
    name: OpEx Dashboards
    uses: pagopa/dx/.github/workflows/opex-dashboard-deploy.yaml@a48a894c64c3f04404ebe274ce9a750c903c7d70 # main
    secrets: inherit
