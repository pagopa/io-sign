name: PR - IO Sign TF Validation

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "infra/resources/prod/**"
      - ".github/workflows/tf-code-review.yaml"

jobs:
  prod_itn_core_code_review:
    uses: pagopa/dx/.github/workflows/infra_plan.yaml@625f02f382c33eb449cd94facb8e426bf7ae37ea # main
    name: Prod - Code Review
    secrets: inherit
    with:
      environment: prod
      base_path: infra/resources